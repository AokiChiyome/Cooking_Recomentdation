services:
  roach1:
    image: cockroachdb/cockroach:v26.2.0
    container_name: roach1
    hostname: roach1
    command: >
      start
      --insecure
      --advertise-addr=roach1:26257
      --http-addr=0.0.0.0:8080
      --listen-addr=0.0.0.0:26257
      --join=roach1:26257,roach2:26257,roach3:26257

    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - roach1:/cockroach/cockroach-data
    networks:
      - roachnet

  roach2:
    image: cockroachdb/cockroach:v26.2.0
    container_name: roach2
    hostname: roach2
    command: >
      start
      --insecure
      --advertise-addr=roach2:26257
      --http-addr=0.0.0.0:8081
      --listen-addr=0.0.0.0:26257
      --join=roach1:26257,roach2:26257,roach3:26257

    ports:
      - "26258:26257"
      - "8081:8081"
    volumes:
      - roach2:/cockroach/cockroach-data
    networks:
      - roachnet

  roach3:
    image: cockroachdb/cockroach:v26.2.0
    container_name: roach3
    hostname: roach3
    command: >
      start
      --insecure
      --advertise-addr=roach3:26257
      --http-addr=0.0.0.0:8082
      --listen-addr=0.0.0.0:26257
      --join=roach1:26257,roach2:26257,roach3:26257

    ports:
      - "26259:26257"
      - "8082:8082"
    volumes:
      - roach3:/cockroach/cockroach-data
    networks:
      - roachnet

  haproxy:
    image: haproxy:3.0
    container_name: haproxy
    hostname: haproxy
    ports:
      - "26260:26257"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - roach1
      - roach2
      - roach3
    networks:
      - roachnet

networks:
  roachnet:

volumes:
  roach1:
  roach2:
  roach3:
